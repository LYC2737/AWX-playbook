---
  - name: "Play_1"
    hosts: all
    become: yes
    gather_facts: true

    tasks:
      - name: "Install Package"
        dnf:
          name: "{{ item }}"
          state: present
        loop:
          - vim
          - wget
          - tcpdump

      - name: "UnInstall Package"
        dnf:
          name: "{{ item }}"
          state: absent
        loop:
          - vim
          - wget
          - tcpdump

  - name: "Play_2"
    hosts: all
    become: yes
    gather_facts: true

    tasks:
      - name: "Make Directory"
        file:
          path: /tmp/data
          state: directory
          mode: '0755'
      
      - name: "Make File"
        copy:
          dest: /tmp/data/test.txt
          content: |
            Hello World!
            ha Ha HA
      - name: "Remove Directory"
        file:
          path: /tmp/data/
          state: absent


  - name: "Play_3"
    hosts: all
    become: yes
    gather_facts: true

    tasks:
      - name: "Install package"
        dnf:
          name: httpd
          state: present
      - name: "Start & Enable Package"
        service:
          name: httpd
          state: started
          enabled: true
      - name: "Stop & Disable Package"
        service:
          name: httpd
          state: stopped
          enabled: false
      - name: "Uninstall Package"
        dnf:
          name: httpd
          state: absent

  - name: "Play_4"
    hosts: all
    become: yes
    gather_facts: true

    tasks:
      - name: "Create user"
        user:
          name: admin
          password: '$6$g8PBeAl9lUplgA2s$me86u6/Frl9Ub7GCvgIlKjBirqQu0lr4ZmeLx14Qw0y5LuW6CUFxpBy/re3b5JqsXSH9BWqPyrJfze26AcxND/'
          # password는 openssl passwd -6 'password'방식으로 생성
          # 또는 password: "{{ '123' | password_hash('sha512')  }}"로도 작성 가능
          shell: /bin/bash
          create_home: yes

      - name: "Add sudo Permission"
        copy:
          dest: /etc/sudoers.d/admin
          content: |
            admin ALL=(ALL) ALL

      - name: "Delete sudo Permission"
        file:
          path: /etc/sudoers.d/admin
          state: absent

      - name: "Remove user"
        user:
          name: admin
          state: absent
          remove: yes

